name: proot field test

# proot 5.1.107.101 (this branch) against 5.1.107.92 (from 92ef17a) on an Android emulator,
# inside the app's own process. See app/src/androidTest/.../ProotFieldTest.kt.
on:
  push:
    branches: [ 'fieldtest/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fieldtest:
    name: proot ${{ matrix.proot }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        proot: [ '101' ]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use proot 5.1.107.92 for this leg
        if: matrix.proot == '92'
        run: git checkout 92ef17a -- app/src/x86_64/jniLibs/x86_64/

      - name: Show bundled proot version
        run: strings -n6 app/src/x86_64/jniLibs/x86_64/libproot.so | grep -m1 -E '^5\.1\.107'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Tailscale library
        id: tsbridge-cache
        uses: actions/cache@v5
        with:
          path: app/libs/tsbridge.aar
          key: tsbridge-${{ hashFiles('tsbridge/**') }}

      - name: Set up Go
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache: false

      - name: Build Tailscale library
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        run: bash tsbridge/build-aar.sh

      - name: Build app and test APKs (x86_64 Linux included), bridge unit test
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --tests '*GuestApkBridgeTest' -Phermes.x86_64=true --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run field test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/proot-fieldtest-emulator.sh

      - name: Summary
        if: always()
        run: |
          { echo "## proot ${{ matrix.proot }}"; echo '```'; grep -E 'RESULT|npm run|gradle rc|-- apk|== |wrapper:|FAILED|failed|fatal|error' build/proot-fieldtest/pft.log || cat build/proot-fieldtest/pft.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proot-fieldtest-${{ matrix.proot }}
          path: build/proot-fieldtest/
