name: Exhaustive Real-World Validation

# Separate from routine CI. This push trigger only runs when this harness changes.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to validate"
        required: true
        type: string
        default: claude/pairing
      run_live_gateway:
        description: "Run real Gateway tests. Requires HERMES_LIVE_URL and can consume model quota."
        required: true
        type: boolean
        default: false
  push:
    branches:
      - claude/pairing
    paths:
      - .github/workflows/exhaustive-validation.yml
      - scripts/exhaustive_feature_audit.py
      - docs/qa/EXHAUSTIVE_VALIDATION.md

permissions:
  contents: read

concurrency:
  group: exhaustive-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test, launch, and report
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_REF: ${{ inputs.target_ref || github.ref }}
      HERMES_LIVE_URL: ${{ inputs.run_live_gateway && secrets.HERMES_LIVE_URL || '' }}
      HERMES_LIVE_MODEL: ${{ inputs.run_live_gateway && secrets.HERMES_LIVE_MODEL || '' }}

    steps:
      - name: Checkout selected target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Record target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p build/exhaustive-validation
          {
            echo "# Target build"
            echo
            echo "- Requested ref: $TARGET_REF"
            echo "- Resolved commit: $SHA"
            echo "- Commit date: $(git show -s --format=%cI "$SHA")"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Runner: $RUNNER_OS"
          } > build/exhaustive-validation/target-build.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Cache Tailscale Android library
        id: tsbridge-cache
        uses: actions/cache@v4
        with:
          path: app/libs/tsbridge.aar
          key: tsbridge-${{ hashFiles('tsbridge/go.mod', 'tsbridge/go.sum', 'tsbridge/**/*.go') }}
          restore-keys: |
            tsbridge-

      - name: Set up Go
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: tsbridge/go.mod
          cache: false

      - name: Build Tailscale Android library
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash tsbridge/build-aar.sh

      - name: Check architecture layer boundaries
        run: bash scripts/check-layers.sh

      - name: Generate source inventory and scenario matrix
        if: always()
        run: python3 scripts/exhaustive_feature_audit.py --root . --output build/exhaustive-validation

      - name: Validate live-test configuration
        if: ${{ inputs.run_live_gateway == true }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HERMES_LIVE_URL" ]]; then
            echo "::error::Live Gateway was requested, but secret HERMES_LIVE_URL is missing."
            exit 1
          fi
          echo "Live Gateway tests enabled. Endpoint intentionally not printed."

      - name: Build APK and run JVM/Robolectric tests
        shell: bash
        env:
          HERMES_LIVE_URL: ${{ env.HERMES_LIVE_URL }}
          HERMES_LIVE_MODEL: ${{ env.HERMES_LIVE_MODEL }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      # tsbridge is built for arm64-v8a, so use an arm64 system image.
      - name: Run Android instrumentation and real-app launch probes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set +e
            mkdir -p build/exhaustive-validation
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
            instrumentation_rc=$?

            adb logcat -c
            adb shell am force-stop com.hermes.android.debug
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.hermes.android.debug/com.hermes.android.MainActivity > build/exhaustive-validation/cold-start.txt 2>&1
            startup_rc=$?
            sleep 12

            adb shell pidof com.hermes.android.debug > build/exhaustive-validation/app-pid.txt 2>&1
            if [[ ! -s build/exhaustive-validation/app-pid.txt ]]; then
              echo "::error::Hermes Pocket did not remain alive after launch."
              startup_rc=1
            fi

            adb shell dumpsys meminfo com.hermes.android.debug > build/exhaustive-validation/memory-after-launch.txt 2>&1
            adb logcat -d -v threadtime > build/exhaustive-validation/emulator-logcat.txt 2>&1
            adb shell screencap -p /sdcard/hermes-pocket-validation.png
            adb pull /sdcard/hermes-pocket-validation.png build/exhaustive-validation/ 2>/dev/null || true

            if grep -E 'FATAL EXCEPTION|ANR in com\.hermes\.android\.debug' build/exhaustive-validation/emulator-logcat.txt; then
              echo "::error::Fatal exception or ANR observed after logcat was cleared."
              startup_rc=1
            fi
            {
              echo "# Device probe"
              echo
              echo "- Instrumentation exit code: $instrumentation_rc"
              echo "- App launch probe exit code: $startup_rc"
              echo "- Process visible after 12 seconds: $([[ -s build/exhaustive-validation/app-pid.txt ]] && echo yes || echo no)"
              echo "- Startup timing: cold-start.txt"
              echo "- Memory snapshot: memory-after-launch.txt; one snapshot is not a leak/stress conclusion"
            } > build/exhaustive-validation/device-probe.md

            if [[ $instrumentation_rc -ne 0 || $startup_rc -ne 0 ]]; then
              exit 1
            fi

      - name: Finalize report
        if: always()
        shell: bash
        run: |
          python3 scripts/exhaustive_feature_audit.py --root . --output build/exhaustive-validation --include-test-results || true
          {
            echo
            echo "## Run result"
            echo
            echo "- Target commit: ${{ steps.target.outputs.sha || github.sha }}"
            echo "- Live Gateway requested: ${{ inputs.run_live_gateway == true }}"
            echo "- Live Gateway configured: $([[ -n "$HERMES_LIVE_URL" ]] && echo yes || echo no)"
            echo
            echo "A missing JUnit file means that stage did not produce a report; it is not a pass."
          } >> build/exhaustive-validation/audit-summary.md

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-validation-${{ steps.target.outputs.sha || github.sha }}
          path: |
            build/exhaustive-validation/**
            app/build/test-results/**/*.xml
            app/build/reports/tests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 21

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [[ -f build/exhaustive-validation/audit-summary.md ]]; then
            cat build/exhaustive-validation/audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
