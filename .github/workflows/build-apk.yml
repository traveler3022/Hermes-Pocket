name: Build Debug APK

# Trigger on pushes to main, claude/**, and feature/**, manual dispatch, and pull requests.
# Every successful build uploads the APK as a downloadable GitHub Actions artifact.
# The rolling debug release is updated only by pushes to main.

on:
  push:
    branches: [ main, 'claude/**', 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    # contents: write is needed to publish the APK to a GitHub Release
    # (a durable delivery channel that does not consume the Actions
    # artifact-storage quota).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Tailscale inside the app: tsbridge/ built with gomobile. Cached by its source, so the Go
      # build (several minutes) runs only when tsbridge/ changes.
      - name: Cache Tailscale library
        id: tsbridge-cache
        uses: actions/cache@v4
        with:
          path: app/libs/tsbridge.aar
          key: tsbridge-${{ hashFiles('tsbridge/**') }}

      - name: Set up Go
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: tsbridge/go.mod
          cache: false

      - name: Build Tailscale library
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        run: bash tsbridge/build-aar.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/*.apk

      # Primary delivery: publish the APK to a rolling pre-release. Release
      # assets do NOT count against the Actions artifact-storage quota, so this
      # keeps working even when that quota is exhausted. The `debug-latest` tag
      # is recreated each run so the download URL is always stable:
      #   .../releases/download/debug-latest/app-debug.apk
      # Publish rolling debug release — stable download URL:
      #   .../releases/download/debug-latest/app-debug.apk
      # Old release is deleted first so only one exists at any time (saves storage).
      - name: Publish APK to rolling debug release
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete ALL existing pre-releases except debug-latest to keep storage clean
          gh release list --limit 20 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease==true and .tagName!="debug-latest") | .tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag || true
          # Recreate the single rolling release. The asset upload can hit a
          # transient HTTP 404 on uploads.github.com, so retry a few times.
          NOTES="$(printf 'Branch: %s\nCommit: %s\nBuilt: %s' \
            "$GITHUB_REF_NAME" "${GITHUB_SHA:0:8}" "$(date -u '+%Y-%m-%d %H:%M UTC')")"
          for attempt in 1 2 3; do
            gh release delete debug-latest --yes --cleanup-tag || true
            sleep 2
            if gh release create debug-latest app/build/outputs/apk/debug/*.apk \
                --prerelease \
                --title "Debug APK (latest)" \
                --target "$GITHUB_SHA" \
                --notes "$NOTES"; then
              echo "Release published on attempt $attempt"
              break
            fi
            echo "Release publish attempt $attempt failed; retrying in 10s…"
            sleep 10
          done
