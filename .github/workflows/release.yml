name: Release Signed APK

# Cut a real, signed release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds a SIGNED release APK and publishes it as a GitHub Release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of your .keystore/.jks file
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: Existing stable release tag to update (for example v3.0.0)
        required: true
        type: string

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release target
        id: release-target
        env:
          TARGET_RELEASE_TAG: ${{ inputs.target_release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual signed-release runs must be dispatched from main."
              exit 1
            fi
            if [[ ! "$TARGET_RELEASE_TAG" =~ ^v[0-9] ]] || ! git check-ref-format "refs/tags/$TARGET_RELEASE_TAG"; then
              echo "::error::An explicit, valid version release tag is required."
              exit 1
            fi
            if ! git ls-remote --exit-code origin "refs/tags/$TARGET_RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TARGET_RELEASE_TAG does not exist on origin; refusing to create a release."
              exit 1
            fi
            if ! release_json="$(gh release view "$TARGET_RELEASE_TAG" --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
              echo "::error::Release $TARGET_RELEASE_TAG does not exist; refusing to create a release."
              exit 1
            fi
            if ! jq -e --arg tag "$TARGET_RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false' <<<"$release_json" >/dev/null; then
              echo "::error::Target must be the named existing stable (non-draft, non-prerelease) release."
              exit 1
            fi
          else
            TARGET_RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TARGET_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Tailscale inside the app: tsbridge/ built with gomobile. Cached by its source, so the Go
      # build (several minutes) runs only when tsbridge/ changes.
      - name: Cache Tailscale library
        id: tsbridge-cache
        uses: actions/cache@v4
        with:
          path: app/libs/tsbridge.aar
          key: tsbridge-${{ hashFiles('tsbridge/**') }}

      - name: Set up Go
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: tsbridge/go.mod
          cache: false

      - name: Build Tailscale library
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        run: bash tsbridge/build-aar.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required signing secret $secret_name is missing; refusing to publish an unsigned APK."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          if [[ ! -s "$RUNNER_TEMP/release.keystore" ]]; then
            echo "::error::Decoded signing keystore is empty; refusing to publish."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$apk" ]]; then
            echo "::error::Expected app-release.apk was not produced."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Recheck immediately before upload; manual runs must never create releases.
            if ! gh release view "$TARGET_RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Target release disappeared; refusing to create or modify another release."
              exit 1
            fi
            gh release upload "$TARGET_RELEASE_TAG" "$apk" --clobber
          else
            NOTES="$(printf 'Signed release **%s**\nCommit: %s\nBuilt: %s' \
              "$TARGET_RELEASE_TAG" "${GITHUB_SHA:0:8}" "$(date -u '+%Y-%m-%d %H:%M UTC')")"
            # Works whether the tag was pushed from git (no release yet) OR the
            # release was drafted in the GitHub web UI (release already exists):
            # create it if missing, otherwise just attach the signed APK.
            if gh release view "$TARGET_RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$TARGET_RELEASE_TAG" "$apk" --clobber
            else
              gh release create "$TARGET_RELEASE_TAG" "$apk" \
                --title "Hermes2 $TARGET_RELEASE_TAG" \
                --notes "$NOTES" \
                --target "$GITHUB_SHA"
            fi
          fi
