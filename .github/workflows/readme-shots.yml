name: README Screenshots

# Renders the real chat and drawer composables (ReadmeScreenshotsTest) to PNGs
# for the README, and every Settings page (SettingsScreenshotsTest) for design
# review. Run by hand; the images come out as the run's artifact.

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/readme-shots' ]

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Tailscale inside the app: tsbridge/ built with gomobile. Cached by its source, so the Go
      # build (several minutes) runs only when tsbridge/ changes.
      - name: Cache Tailscale library
        id: tsbridge-cache
        uses: actions/cache@v5
        with:
          path: app/libs/tsbridge.aar
          key: tsbridge-${{ hashFiles('tsbridge/**') }}

      - name: Set up Go
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: tsbridge/go.mod
          cache: false

      - name: Build Tailscale library
        if: steps.tsbridge-cache.outputs.cache-hit != 'true'
        run: bash tsbridge/build-aar.sh

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Render screenshots
        env:
          README_SHOTS: '1'
          SETTINGS_SHOTS: '1'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests '*ReadmeScreenshotsTest*' --tests '*SettingsScreenshotsTest*' --no-daemon --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: readme-shots
          path: app/build/readme-shots/
