name: Build desktop tools

# The built-in Linux's package repo has no x11vnc, xdotool, openbox, xprop, xclip or xterm.
# They are built here in that same Linux, for both phone CPUs, and published as release
# assets the app downloads when the user installs the desktop.
on:
  push:
    branches: [ glibc-linux ]
    paths: [ 'scripts/desktop-tools/**', '.github/workflows/desktop-tools.yml' ]
  workflow_dispatch:

env:
  TAG: desktop-tools-1

jobs:
  build:
    strategy:
      matrix:
        runner: [ ubuntu-24.04-arm, ubuntu-24.04 ]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build inside the built-in Linux
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/scripts/desktop-tools:/src:ro" -v "$PWD/out:/out" \
            bellsoft/alpaquita-linux-base:stream-glibc sh /src/build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Desktop tools" \
              --notes "x11vnc, xdotool, openbox, xprop, xclip and xterm for the built-in Linux (glibc), arm64 and x86_64." || true
          gh release upload "$TAG" out/*.tar.gz --clobber
